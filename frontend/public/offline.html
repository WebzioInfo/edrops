<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Edrops</title>
  <style>
    :root {
      --primary: #00AEEF;
      --foreground: #16324F;
      --background: #F8FAFC;
      --card: #FFFFFF;
      --muted: #64748B;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 420px;
      padding: 2.5rem;
      background: var(--card);
      border-radius: 1.5rem;
      box-shadow: 0 4px 20px -2px rgba(0, 174, 239, 0.08), 0 2px 8px -1px rgba(0, 174, 239, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
      margin: 1rem;
    }
    .icon-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: rgba(0, 174, 239, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wifi-icon {
      width: 40px;
      height: 40px;
      fill: var(--primary);
    }
    .slash {
      position: absolute;
      width: 50px;
      height: 4px;
      background-color: #EF4444;
      transform: rotate(-45deg);
      border-radius: 2px;
      border: 2px solid var(--card);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 0.5rem;
      color: var(--foreground);
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 2rem;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 174, 239, 0.2);
    }
    button:hover {
      background-color: #0092C8;
    }
    button:active {
      transform: scale(0.98);
    }
    .logo-img {
      height: 36px;
      width: auto;
      margin: 0 auto 2rem;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo-full-blue.svg" alt="E Drops" class="logo-img" />
    <div class="icon-wrapper">
      <svg class="wifi-icon" viewBox="0 0 24 24">
        <path d="M12 21l-12-12c2.8-2.8 6.8-4 12-4s9.2 1.2 12 4l-12 12z"/>
      </svg>
      <div class="slash"></div>
    </div>
    <h1>You are offline</h1>
    <p>Please check your internet connection. E Drops needs an active connection to fetch real-time orders and delivery status.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
